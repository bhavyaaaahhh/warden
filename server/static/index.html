<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>warden · traces</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #fafafa; --panel: #fff; --text: #1a1a1a; --muted: #6b6b6b;
    --border: #e5e5e5; --hover: #f2f2f2; --selected: #e8f0fe;
    --ok: #1e8e3e; --err: #d93025; --running: #b06000;
    --llm_call: #7b61ff; --tool_call: #f29900; --retrieval: #1a73e8;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --panel: #1c1c1c; --text: #e8e8e8; --muted: #9a9a9a;
      --border: #2e2e2e; --hover: #242424; --selected: #1f2d45;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; }
  header input { margin-left: auto; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); width: 200px; }
  button { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); cursor: pointer; }
  main { display: grid; grid-template-columns: 420px 1fr; height: calc(100vh - 47px); }
  #list { overflow-y: auto; border-right: 1px solid var(--border); background: var(--panel); }
  #detail { overflow-y: auto; padding: 16px 20px; }
  .row { padding: 9px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .row:hover { background: var(--hover); }
  .row.selected { background: var(--selected); }
  .row .top { display: flex; gap: 8px; align-items: baseline; }
  .row .name { font-weight: 600; }
  .row .when { margin-left: auto; color: var(--muted); font-size: 12px; }
  .row .input { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .row .stats { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tag { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--hover); border: 1px solid var(--border); }
  .status { font-size: 11px; font-weight: 600; text-transform: uppercase; }
  .status.success { color: var(--ok); } .status.error { color: var(--err); } .status.running { color: var(--running); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .meta { color: var(--muted); margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 14px; }
  .meta code { font-family: var(--mono); }
  .waterfall { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin-bottom: 16px; }
  .span { display: grid; grid-template-columns: 300px 1fr 70px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .span:last-child { border-bottom: none; }
  .span:hover { background: var(--hover); }
  .span.selected { background: var(--selected); }
  .span .label { display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; }
  .span .label .n { overflow: hidden; text-overflow: ellipsis; }
  .span .label .err { color: var(--err); font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .track { position: relative; height: 14px; }
  .bar { position: absolute; top: 2px; height: 10px; border-radius: 3px; min-width: 2px; }
  .dur { text-align: right; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .panel { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); padding: 12px 14px; }
  .panel h3 { font-size: 14px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
  .kv { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); margin-bottom: 10px; }
  .kv b { color: var(--text); font-weight: 500; }
  .label-sm { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
  pre { margin: 0; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }
  pre.error { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>warden</h1>
  <span style="color:var(--muted)">traces</span>
  <input id="filter" placeholder="filter by agent_name">
  <button id="refresh">Refresh</button>
</header>
<main>
  <section id="list"></section>
  <section id="detail"><div class="empty">Select a trace</div></section>
</main>

<script>
// All user/LLM content is inserted via textContent, never innerHTML.
const $ = (tag, props = {}, ...children) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el[k] = v;
  }
  for (const c of children) if (c != null) el.append(c);
  return el;
};

const ms = (a, b) => (a && b) ? new Date(b) - new Date(a) : null;
const fmtMs = (d) => d == null ? "—" : d < 1000 ? `${d} ms` : `${(d / 1000).toFixed(2)} s`;
const fmtWhen = (iso) => new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
const fmtCost = (c) => c == null ? null : `$${Number(c).toFixed(6)}`;
const preview = (v) => v == null ? "" : typeof v === "string" ? v : JSON.stringify(v);
const pretty = (v) => v == null ? "null" : typeof v === "string" ? v : JSON.stringify(v, null, 2);

let selectedTrace = null;

async function loadList() {
  const agent = document.getElementById("filter").value.trim();
  const url = agent ? `/traces?agent_name=${encodeURIComponent(agent)}` : "/traces";
  const list = document.getElementById("list");
  let traces;
  try {
    traces = await (await fetch(url)).json();
  } catch (e) {
    list.replaceChildren($("div", { className: "empty", textContent: "Failed to load traces" }));
    return;
  }
  if (!traces.length) {
    list.replaceChildren($("div", { className: "empty", textContent: "No traces yet. Run an agent with the SDK." }));
    return;
  }
  list.replaceChildren(...traces.map((t) => {
    const tokens = (t.tokens_input || 0) + (t.tokens_output || 0);
    const stats = [`${t.span_count} spans`, fmtMs(ms(t.started_at, t.ended_at))];
    if (tokens) stats.push(`${tokens} tok`);
    if (t.cost_usd != null) stats.push(fmtCost(t.cost_usd));
    return $("div", {
      className: "row" + (t.trace_id === selectedTrace ? " selected" : ""),
      onclick: () => { location.hash = t.trace_id; },
    },
      $("div", { className: "top" },
        $("span", { className: "name", textContent: t.agent_name }),
        t.version_tag ? $("span", { className: "tag", textContent: t.version_tag }) : null,
        $("span", { className: `status ${t.status}`, textContent: t.status }),
        $("span", { className: "when", textContent: fmtWhen(t.started_at) }),
      ),
      $("div", { className: "input", textContent: preview(t.input) }),
      $("div", { className: "stats", textContent: stats.join(" · ") }),
    );
  }));
}

// Order spans parent-before-child (depth-first), keeping start-time order among siblings.
function flattenTree(spans) {
  const byParent = new Map();
  const ids = new Set(spans.map((s) => s.span_id));
  for (const s of spans) {
    const key = s.parent_span_id && ids.has(s.parent_span_id) ? s.parent_span_id : null;
    if (!byParent.has(key)) byParent.set(key, []);
    byParent.get(key).push(s);
  }
  const out = [];
  const walk = (parent, depth) => {
    for (const s of byParent.get(parent) || []) {
      out.push({ span: s, depth });
      walk(s.span_id, depth + 1);
    }
  };
  walk(null, 0);
  return out;
}

async function loadTrace(traceId) {
  selectedTrace = traceId;
  document.querySelectorAll(".row").forEach((r) => r.classList.remove("selected"));
  const detail = document.getElementById("detail");
  const res = await fetch(`/traces/${traceId}`);
  if (!res.ok) {
    detail.replaceChildren($("div", { className: "empty", textContent: "Trace not found" }));
    return;
  }
  const t = await res.json();
  loadList();

  const t0 = new Date(t.started_at).getTime();
  const tEnd = Math.max(
    t.ended_at ? new Date(t.ended_at).getTime() : t0,
    ...t.spans.map((s) => new Date(s.ended_at || s.started_at).getTime()),
  );
  const total = Math.max(tEnd - t0, 1);

  const spanPanel = $("div");
  const rows = flattenTree(t.spans).map(({ span: s, depth }) => {
    const start = new Date(s.started_at).getTime() - t0;
    const dur = ms(s.started_at, s.ended_at);
    const row = $("div", { className: "span", onclick: () => {
      document.querySelectorAll(".span").forEach((r) => r.classList.remove("selected"));
      row.classList.add("selected");
      showSpan(spanPanel, s);
    } },
      $("div", { className: "label", style: `padding-left:${depth * 16}px` },
        $("span", { className: "dot", style: `background:var(--${s.span_type})` }),
        $("span", { className: "n", textContent: s.name }),
        s.error ? $("span", { className: "err", textContent: "!", title: s.error }) : null,
      ),
      $("div", { className: "track" },
        $("div", { className: "bar", style:
          `left:${(start / total) * 100}%;width:${((dur || 0) / total) * 100}%;background:var(--${s.span_type})` }),
      ),
      $("div", { className: "dur", textContent: fmtMs(dur) }),
    );
    return row;
  });

  detail.replaceChildren(
    $("h2", {},
      document.createTextNode(t.agent_name + " "),
      t.version_tag ? $("span", { className: "tag", textContent: t.version_tag }) : null,
      document.createTextNode(" "),
      $("span", { className: `status ${t.status}`, textContent: t.status }),
    ),
    $("div", { className: "meta" },
      $("span", {}, "trace ", $("code", { textContent: t.trace_id })),
      $("span", { textContent: fmtWhen(t.started_at) }),
      $("span", { textContent: fmtMs(ms(t.started_at, t.ended_at)) }),
    ),
    $("div", { className: "label-sm", textContent: "Input" }),
    $("pre", { textContent: pretty(t.input), style: "margin-bottom:16px" }),
    Object.keys(t.metadata || {}).length
      ? $("div", {}, $("div", { className: "label-sm", textContent: "Metadata" }),
          $("pre", { textContent: pretty(t.metadata), style: "margin-bottom:16px" }))
      : null,
    $("div", { className: "label-sm", textContent: `Spans (${t.spans.length})` }),
    rows.length ? $("div", { className: "waterfall" }, ...rows)
                : $("div", { className: "empty", textContent: "No spans" }),
    spanPanel,
  );
  if (rows.length) rows[0].click();
}

function showSpan(panel, s) {
  const kv = [["type", s.span_type], ["duration", fmtMs(ms(s.started_at, s.ended_at))]];
  if (s.tokens_input != null) kv.push(["tokens in", s.tokens_input]);
  if (s.tokens_output != null) kv.push(["tokens out", s.tokens_output]);
  if (s.cost_usd != null) kv.push(["cost", fmtCost(s.cost_usd)]);
  panel.replaceChildren($("div", { className: "panel" },
    $("h3", {}, $("span", { className: "dot", style: `background:var(--${s.span_type})` }),
      document.createTextNode(s.name)),
    $("div", { className: "kv" }, ...kv.map(([k, v]) =>
      $("span", {}, document.createTextNode(k + " "), $("b", { textContent: String(v) })))),
    s.error ? $("div", {}, $("div", { className: "label-sm", textContent: "Error" }),
      $("pre", { className: "error", textContent: s.error })) : null,
    $("div", { className: "label-sm", textContent: "Input" }),
    $("pre", { textContent: pretty(s.input) }),
    $("div", { className: "label-sm", textContent: "Output" }),
    $("pre", { textContent: pretty(s.output) }),
  ));
}

const route = () => {
  const id = location.hash.slice(1);
  if (id) loadTrace(id); else loadList();
};

let filterTimer;
document.getElementById("filter").addEventListener("input", () => {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(loadList, 250);
});
document.getElementById("refresh").addEventListener("click", () => {
  loadList();
  if (selectedTrace) loadTrace(selectedTrace);
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
